<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Your Free AI Solution — Fernvay Consulting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Page-specific overrides ── */
    .lead-hero {
      background: linear-gradient(150deg, #0b1a30 0%, #0d2448 45%, #162d5e 100%);
      padding: 9rem 2rem 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .lead-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 15%, rgba(201, 168, 76, .13) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(30, 64, 128, .35) 0%, transparent 60%);
      pointer-events: none;
    }

    .lead-hero-content {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
    }

    .lead-hero .section-label {
      color: var(--gold-light);
    }

    .lead-hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 300;
      color: var(--cream);
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .lead-hero h1 em {
      font-style: italic;
      color: var(--gold-light);
    }

    .lead-hero p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 300;
      color: rgba(244, 241, 236, .75);
      line-height: 1.65;
      max-width: 540px;
      margin: 0 auto;
    }

    /* ── Form section ── */
    .lead-form-section {
      background: var(--white);
      padding: 2rem 2rem 3rem;
    }

    .lead-form-inner {
      max-width: 640px;
      margin: 0 auto;
    }

    .form-group textarea {
      min-height: 150px;
    }

    /* Submit button full-width */
    .form-submit-full {
      width: 100%;
      padding: 1rem 2rem;
      font-size: .8rem;
      letter-spacing: .16em;
      margin-top: .4rem;
    }

    /* ── Success state ── */
    .success-state {
      display: none;
      text-align: center;
      padding: 3rem 2rem;
      animation: fadeUp .7s ease both;
    }

    .success-state.visible {
      display: block;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.8rem;
    }

    .success-icon svg {
      width: 30px;
      height: 30px;
      color: var(--navy);
    }

    .success-state h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 300;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .success-state h2 em {
      font-style: italic;
      color: var(--steel);
    }

    .success-state p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      color: var(--steel);
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 2rem;
    }

    /* ── Error message ── */
    .form-error {
      display: none;
      background: rgba(180, 50, 50, .08);
      border: 1px solid rgba(180, 50, 50, .25);
      padding: .85rem 1.1rem;
      font-size: .82rem;
      color: #8b2020;
      line-height: 1.5;
      margin-top: .5rem;
    }

    .form-error.visible {
      display: block;
    }

    /* ── Button style to match site ── */
    .btn-primary {
      background: var(--gold);
      color: #fff;
      border: 2px solid var(--gold);
      border-radius: 0;
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--gold);
      transform: none;
    }

    /* ── Loading state on button ── */
    .btn-loading {
      opacity: .65;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-loading::after {
      content: ' ...';
    }

    /* ── Trust badges ── */
    .trust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .63rem;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--steel);
    }

    .trust-item svg {
      width: 14px;
      height: 14px;
      color: var(--gold);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- FORM -->
  <section class="lead-form-section">
    <div class="lead-form-inner">

      <!-- The form -->
      <form class="contact-form" id="leadForm" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="name" data-i18n="nameLabel">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Jane Smith" data-i18n-placeholder="namePh" required />
          </div>
          <div class="form-group">
            <label for="email" data-i18n="emailLabel">Business Email</label>
            <input type="email" id="email" name="email" placeholder="jane@company.com" data-i18n-placeholder="emailPh" required />
          </div>
        </div>

        <div class="form-group">
          <label for="bottleneck" data-i18n="bottleneckLabel">What is your biggest business bottleneck?</label>
          <textarea id="bottleneck" name="bottleneck" data-i18n-placeholder="bottleneckPh" placeholder="e.g. We spend 10+ hours a week manually following up with leads and it still falls through the cracks..." required></textarea>
        </div>

        <div class="form-error" id="formError"></div>

        <button type="submit" class="btn btn-primary form-submit-full" id="submitBtn" data-i18n="submit">
          Get My Free AI Solution
        </button>

      </form>

      <!-- Success state (hidden until submit) -->
      <div class="success-state" id="successState">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2 data-i18n-html="successTitle">Check your inbox — our<br /><em>AI assistant</em> just drafted<br />a solution for you!</h2>
        <p data-i18n="successText">We've sent a custom strategy to your email. While you're here, let's talk about making it a reality.</p>
        <a href="https://www.fernvayconsulting.com/discovery-call/" class="btn btn-primary" id="discoveryBtn" data-i18n="successCta">Schedule a Discovery Call</a>
      </div>

      <!-- Trust row -->
      <div class="trust-row">
        <span class="trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span data-i18n="trustSpam">No spam, ever</span>
        </span>
        <span class="trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span data-i18n="trustSpeed">Response in seconds</span>
        </span>
        <span class="trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span data-i18n="trustFree">100% free</span>
        </span>
      </div>

    </div>
  </section>

  <script>
    // ── Language ──
    // ?lang=es shows the Spanish version (used by fernvayconsulting.com/es/).
    // No lang parameter = English, exactly as before.
    const LANG = /^es\b/i.test(new URLSearchParams(location.search).get('lang') || '') ? 'es' : 'en';
    const T = {
      en: {
        fillAll: 'Please fill in all fields before submitting.',
        badEmail: 'Please enter a valid email address.',
        loading: 'Generating your solution',
        submit: 'Get My Free AI Solution',
        genericError: 'Something went wrong. Please try again.',
      },
      es: {
        title: 'Obtenga su solución de IA gratuita — Fernvay Consulting',
        nameLabel: 'Nombre completo',
        namePh: 'Ana García',
        emailLabel: 'Correo electrónico de su negocio',
        emailPh: 'ana@empresa.com',
        bottleneckLabel: '¿Cuál es el mayor cuello de botella de su negocio?',
        bottleneckPh: 'Ej.: Dedicamos más de 10 horas a la semana a dar seguimiento manual a los prospectos y aun así se nos escapan...',
        submit: 'Obtener mi solución de IA gratuita',
        successTitle: '¡Revise su bandeja de entrada! Nuestro<br /><em>asistente de IA</em> acaba de preparar<br />una solución para usted.',
        successText: 'Le enviamos una estrategia personalizada a su correo. Ya que está aquí, hablemos de cómo hacerla realidad.',
        successCta: 'Reserve su Revisión de Procesos Gratuita',
        successUrl: 'https://fernvayconsulting.com/es/revision-de-procesos-gratuita/',
        trustSpam: 'Sin spam, nunca',
        trustSpeed: 'Respuesta en segundos',
        trustFree: '100% gratis',
        fillAll: 'Por favor complete todos los campos antes de enviar.',
        badEmail: 'Por favor ingrese un correo electrónico válido.',
        loading: 'Generando su solución',
        genericError: 'Algo salió mal. Por favor intente de nuevo.',
      },
    };
    const t = (k) => T[LANG][k] ?? T.en[k];

    if (LANG === 'es') {
      document.documentElement.lang = 'es';
      document.title = T.es.title;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T.es[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T.es[el.dataset.i18nHtml]; });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = T.es[el.dataset.i18nPlaceholder]; });
      document.getElementById('discoveryBtn').href = T.es.successUrl;
    }

    const form = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const successState = document.getElementById('successState');
    const formError = document.getElementById('formError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const bottleneck = document.getElementById('bottleneck').value.trim();

      // Basic validation
      if (!name || !email || !bottleneck) {
        showError(t('fillAll'));
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError(t('badEmail'));
        return;
      }

      // Loading state
      formError.classList.remove('visible');
      submitBtn.classList.add('btn-loading');
      submitBtn.textContent = t('loading');

      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, bottleneck, lang: LANG }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(LANG === 'es' ? t('genericError') : (data.error || t('genericError')));
        }

        // Show success
        form.style.display = 'none';
        successState.classList.add('visible');

      } catch (err) {
        showError(LANG === 'es' ? t('genericError') : err.message);
        submitBtn.classList.remove('btn-loading');
        submitBtn.textContent = t('submit');
      }
    });

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.add('visible');
    }

    // Navigate parent page instead of opening link inside iframe
    document.getElementById('discoveryBtn').addEventListener('click', function(e) {
      e.preventDefault();
      window.parent.postMessage(
        { type: 'fernvay-navigate', url: this.href },
        '*'
      );
    });

    // Tell the parent iframe to resize whenever content height changes
    function postHeight() {
      window.parent.postMessage(
        { type: 'fernvay-resize', height: document.body.scrollHeight },
        '*'
      );
    }

    // Fire on load and whenever DOM changes (success state, errors, etc.)
    postHeight();
    new ResizeObserver(postHeight).observe(document.body);
  </script>

</body>
</html>
